name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.11.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Only run if:
    # 1. Triggered by a tag push (manual or external), OR
    # 2. Triggered by CI workflow completion that was successful, OR
    # 3. Manually triggered via workflow_dispatch
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      major: ${{ steps.version.outputs.major }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          # For workflow_run: checkout the head SHA of the CI workflow
          # For tag push: checkout the tag ref
          # For workflow_dispatch: checkout the specified tag
          ref: |
            ${{
              (github.event.inputs.tag != '' && github.event.inputs.tag) ||
              (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) ||
              github.ref
            }}

      - name: Extract version from tag
        id: version
        run: |
          # Get tag from workflow_dispatch input, tag push event, or find latest tag for workflow_run
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Find the tag associated with the CI workflow's head commit
            # Note: There may be a brief delay before the tag is visible after CI push
            TAG=$(git describe --tags --exact-match ${{ github.event.workflow_run.head_sha }} 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              echo "Error: No tag found for CI workflow commit ${{ github.event.workflow_run.head_sha }}"
              echo "This indicates that the CI workflow completed without creating a tag."
              echo "Check the CI workflow logs to see if versionize was skipped due to:"
              echo "  - No release-worthy changes since last tag"
              echo "  - Only insignificant commits (docs, tests, etc.)"
              echo "  - CI workflow failure before tag creation"
              echo "Note: If the CI workflow just completed, there may be a brief delay before"
              echo "the tag becomes visible. If this is a timing issue, manually trigger this"
              echo "workflow after a few seconds using workflow_dispatch with the tag name."
              exit 1
            fi
            echo "Found tag $TAG for CI workflow run"
          else
            TAG="${{ github.ref }}"
          fi
          VERSION=${TAG#refs/tags/v}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f1-2)
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Find previous GitHub release
        id: previous_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAGER: cat
          PAGER: cat
        run: |
          last=$(GH_PAGER=cat gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          last=${last#v}
          echo "last=${last}" >> $GITHUB_OUTPUT

      - name: Find user-focused release notes
        id: find_release_notes
        run: |
          # Try to find release notes file in feature/fix/workflow directories
          # Search for most recent release-notes.md by extracting numeric prefixes and sorting
          RELEASE_NOTES_FILE=$(find docs/features docs/issues docs/workflow -name "release-notes.md" -type f 2>/dev/null | \
            awk -F'/' '{
              # Extract directory name (e.g., "059-tool-column-findings-tables")
              dir = $(NF-1);
              # Extract leading numeric prefix
              match(dir, /^[0-9]+/);
              num = substr(dir, RSTART, RLENGTH);
              # Print numeric prefix (padded) and full path for sorting
              printf "%05d %s\n", num, $0;
            }' | \
            sort -rn | \
            head -n 1 | \
            cut -d' ' -f2-)
          if [ -n "$RELEASE_NOTES_FILE" ] && [ -f "$RELEASE_NOTES_FILE" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=$RELEASE_NOTES_FILE" >> $GITHUB_OUTPUT
            echo "Found user-focused release notes: $RELEASE_NOTES_FILE"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No user-focused release notes found, will use changelog extraction"
          fi

      - name: Extract changelog range
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          LAST="${{ steps.previous_release.outputs.last }}"

          # Use user-focused release notes if available
          if [ "${{ steps.find_release_notes.outputs.found }}" = "true" ]; then
            echo "Using user-focused release notes from ${{ steps.find_release_notes.outputs.path }}"
            cp "${{ steps.find_release_notes.outputs.path }}" release-notes.md
          else
            echo "Extracting changelog for version $VERSION"
            bash scripts/extract-changelog.sh CHANGELOG.md "$VERSION" "$LAST" > release-notes.md
            if [ ! -s release-notes.md ]; then
              echo "Release v${VERSION}" > release-notes.md
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: false
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute Docker tags
        id: docker_tags
        run: |
          TAGS="${{ secrets.DOCKERHUB_USERNAME }}/tfplan2md:${{ needs.release.outputs.version }}"
          if [ "${{ needs.release.outputs.is_prerelease }}" != "true" ]; then
            TAGS="$TAGS\n${{ secrets.DOCKERHUB_USERNAME }}/tfplan2md:${{ needs.release.outputs.minor }}"
            TAGS="$TAGS\n${{ secrets.DOCKERHUB_USERNAME }}/tfplan2md:${{ needs.release.outputs.major }}"
            TAGS="$TAGS\n${{ secrets.DOCKERHUB_USERNAME }}/tfplan2md:latest"
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo -e "$TAGS" >> $GITHUB_OUTPUT
          echo EOF >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Dockerfile
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
